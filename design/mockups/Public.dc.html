<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A86A","options":["#C9A86A","#C46A4F","#8FA68A","#9DB3C4"]},"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  soft(hex, a) {
    var h = String(hex || '#C9A86A').replace('#', '');
    if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + a + ')';
  }
  renderVals() {
    var accent = this.props.accent ?? '#C9A86A';
    return { accent: accent, accentSoft: this.soft(accent, 0.14) };
  }
}
